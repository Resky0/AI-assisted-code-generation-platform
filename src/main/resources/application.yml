spring:
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  application:
    name: yu-ai-code-mother
  # 环境配置 application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 1234
  # redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
ai:
  cost-control:
    enabled: true
    enforcement-enabled: ${AI_COST_ENFORCEMENT_ENABLED:true}
    timezone: Asia/Shanghai
    initial-calls-per-day: 1
    edit-calls-per-day: 3
    user-tokens-per-day: 80000
    global-tokens-per-day: 300000
    initial-trace-tokens: 40000
    edit-trace-tokens: 15000
    initial-tool-rounds: 10
    edit-tool-rounds: 5
    global-concurrency: 2
    user-concurrency: 1
    lease-time: 12m
    max-execution-time: 10m
    key-ttl: 48h
    initial-prompt-max-chars: 1000
    edit-prompt-max-chars: 4000
    max-generated-files: 12
    registration-per-hour: 3
    registration-per-day: 5
    ai-requests-per-ip-per-day: 10
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.resky.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI 模型配置
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-tokens: 8192
#      strict-json-schema: true
#      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      max-tokens: 8192
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      max-tokens: 128
      log-requests: true
      log-responses: true

# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your-custom-domain.com
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-shanghai
    bucket: your-bucket-name
# Pexels 图片搜索配置
pexels:
  api-key: <Your API Key>
# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: wan2.7-image
